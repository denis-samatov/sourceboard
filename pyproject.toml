[project]
name = "sourceboard"
version = "0.1.0"
description = "Local multimodal evidence board: find quotes, pages, frames and timecodes for your claims with EmbeddingGemma 2."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "numpy>=2.0",
    "pypdf>=6.21.2",
    "python-docx>=1.1",
    "pillow>=13.0.0",
]

[project.optional-dependencies]
# EmbeddingGemma 2 (text, images, audio). Model card requires sentence-transformers>=6.1.0.
ml = [
    "sentence-transformers>=6.1.0",
    "transformers>=5.19",
    "torch>=2.6",
    # The EmbeddingGemma2 processor imports a video processor that needs torchvision.
    "torchvision>=0.21",
]
# Local speech recognition for audio/video without subtitles.
asr = ["faster-whisper>=1.1"]

[project.scripts]
sourceboard = "sourceboard.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sourceboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.File"]
